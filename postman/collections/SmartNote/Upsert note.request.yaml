  X-Device-Id: "{{deviceId}}"
body:
  type: text
  content: |-
    {
      "id": "{{noteId}}",
      "title": "Postman note",
      "body": "Created by Postman CLI",
      "kind": "text",
      "checklist": [],
      "tags": ["postman"],
      "imagePaths": [],
      "isFavorite": false,
      "isLocked": false,
      "colorKey": "lavender",
      "createdAt": "2026-08-20T00:00:00.000Z",
      "updatedAt": "2026-08-20T00:00:00.000Z"
    }
scripts:
  - type: afterResponse
    code: pm.test('upsert succeeds', () => pm.response.to.have.status(200));
order: 2000
