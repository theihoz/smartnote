services:
  api:
    build: .
    ports:
      - "8787:8787"
    tmpfs:
      - /app/api/data
    restart: "no"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
